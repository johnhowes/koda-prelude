[package]
name = "prelude-shell"
version = "0.1.0"
description = "Prelude as a desktop app: a window on a Prelude server - started for you when none is running - with a native folder picker and real pop-out windows."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
