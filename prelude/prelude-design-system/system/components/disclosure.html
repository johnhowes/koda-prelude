<!-- Disclosure: a quiet "more" that opens in place - a choice most people never
     need (another stack), or detail behind a summary (a failed tool's output).
     The summary says what's inside. Not for anything the person must see. -->
<details class="disclosure">
  <summary>Choose another stack</summary>
  <label class="field">
    <span class="label">The app’s stack</span>
    <input name="stack" placeholder="ASP.NET Core MVC with Razor" autocomplete="off">
  </label>
</details>
