<!-- Pill: a short label on a thing - its kind or where it stands. One or two words,
     sentence case. Plain for a kind (Design system, App shell); .accent for "this
     one"; .good, .warn and .danger for a state the person should act on. Colour is
     never the only signal: the words say it too. -->
<span class="pill">Design system</span>
<span class="pill accent">Current</span>
<span class="pill good">Check passes</span>
<span class="pill warn">Behind main</span>
<span class="pill danger">Doesn’t render</span>
