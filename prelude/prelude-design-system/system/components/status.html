<!-- Status: what the agent is doing, in one line between the transcript and the
     composer. .pulse while it works, with Stop at the end. When it's idle the line
     isn't there at all. -->
<div class="status" role="status">
  <span class="pulse" aria-hidden="true"></span>
  <span>Working…</span>
  <form action="#" method="post"><button class="btn small ghost" type="submit">Stop</button></form>
</div>
