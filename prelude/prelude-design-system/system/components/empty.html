<!-- Empty: what goes in a place that has nothing yet, and how it gets there. One
     or two sentences; the second says the next step ("Ask the agent…"). Centred
     in whatever holds it. Not an error, so no colour. -->
<p class="empty">No screens yet. Ask the agent to design one, and it appears here as it’s written.</p>

<!-- A whole page with nothing in it yet (a first run) is .empty.page: centred in
     the page's height, an icon, a heading, a sentence or two, and the one primary
     action. It may end with what comes after, as a .grid of short steps. -->
<div class="empty page">
  <span class="icon icon-folder" aria-hidden="true"></span>
  <div class="stack gap-2">
    <h1>Open your first project</h1>
    <p class="secondary">A project is a folder, usually a repo, new or already full of code.</p>
  </div>
  <div class="cluster actions">
    <a class="btn primary large" href="#"><span class="icon icon-folder" aria-hidden="true"></span>Open a project…</a>
  </div>
</div>
