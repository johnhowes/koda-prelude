<!-- Panel: a bordered region that fills its share of a layout - the chat, the design
     surface. It holds a .toolbar, then a .panel-body that scrolls (or a transcript,
     status and composer). The layout around it is the shell's, not the panel's. -->
<section class="panel" aria-label="Design">
  <div class="toolbar">
    <span class="muted">3 screens</span>
    <span class="spacer"></span>
    <a class="btn small ghost" href="#">Refresh</a>
  </div>
  <div class="panel-body">
    <p class="empty">No screens yet. Ask the agent to design one, and it appears here as it’s written.</p>
  </div>
</section>
