<!-- Table: rows of facts to compare across the same columns. Numbers go in .num
     cells, right-aligned in tabular figures. The row's name may be a link. For
     things to open with one or two facts each, use a .list instead. -->
<table class="table">
  <thead><tr><th scope="col">Page</th><th scope="col">State</th><th scope="col" class="num">Forms</th></tr></thead>
  <tbody>
    <tr><td><a href="#">Sign up</a></td><td>empty</td><td class="num">1</td></tr>
    <tr><td><a href="#">Sign up</a></td><td>taken</td><td class="num">1</td></tr>
  </tbody>
</table>
