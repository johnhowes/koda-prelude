<!-- Toolbar: a strip of small controls across the top of a .panel (the design bar).
     Everything in it is .small. What's about the content goes first; a .spacer
     pushes window actions (Refresh, Open in browser, Pop out) to the end. It wraps
     when narrow, so keep labels short. -->
<div class="toolbar">
  <span class="segmented" role="group" aria-label="Show">
    <a class="btn small" href="#" aria-current="true">Design</a>
    <a class="btn small" href="#">App</a>
  </span>
  <span class="muted">3 screens</span>
  <span class="spacer"></span>
  <a class="btn small ghost" href="#">Refresh</a>
  <a class="btn small ghost" href="#" target="_blank"><span class="icon icon-external" aria-hidden="true"></span>Open in browser</a>
</div>
