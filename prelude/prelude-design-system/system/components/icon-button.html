<!-- Icon button: a button that is only a glyph, for an action whose glyph everyone
     knows (close, remove, zoom). It must have an aria-label naming the action and
     its object ("Stop reading another-app"), and a title if the glyph alone could
     be misread. If you'd need a tooltip to explain it, use a .btn with words. -->
<button class="icon-btn" type="button" aria-label="Close"><span class="icon icon-close" aria-hidden="true"></span></button>
<button class="icon-btn small" type="button" aria-label="Zoom in" title="Zoom in"><span class="icon icon-zoom-in" aria-hidden="true"></span></button>
<button class="icon-btn danger" type="submit" aria-label="Stop reading another-app"><span class="icon icon-close" aria-hidden="true"></span></button>
