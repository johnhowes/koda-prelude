<!-- Chip: something that goes along with what the person is about to do, which
     they can leave out - the page they're looking at, going with a message; a
     filter. A pill-shaped label around a checkbox: checked, it's included;
     unchecked, it steps back and is struck through. Say what it is in a title.
     For a fixed label on a thing, use a .pill. -->
<label class="chip" title="Tells the agent which page you mean. Uncheck to leave it out.">
  <input type="checkbox" name="lookingAt" value="true" checked>
  <span class="icon icon-screen" aria-hidden="true"></span>
  <span class="chip-text">Compare offers · Typical · Phone</span>
</label>
