<!-- Grid: equal columns that fill the width, as many as fit - cards of the same
     kind, swatches, a set of options. Each column is at least --min wide (default
     14rem; set it with style="--min: 10rem"); when even one doesn't fit, the
     column takes the whole width. Default gap is --space-4. For a form's fields,
     use .fields; for things of different weight, use .split. -->
<div class="grid">
  <div class="card">…</div>
  <div class="card">…</div>
  <div class="card">…</div>
</div>

<div class="grid gap-2" style="--min: 8rem">
  <span class="pill">One</span>
  <span class="pill">Two</span>
</div>
