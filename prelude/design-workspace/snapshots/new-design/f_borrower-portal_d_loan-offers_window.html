<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>
Pop-out window
</title>
<link href="/static/icon.svg" rel="icon">
<link href="/system/tokens.css" rel="stylesheet">
<link href="/system/components.css" rel="stylesheet">
<link href="/system/icons.css" rel="stylesheet">
<link href="/static/shell.css" rel="stylesheet">
<link href="/static/workspace.css" rel="stylesheet">
<script type="importmap">
{ "imports": { "@kodalang/core": "/koda/koda.js" } }
</script>
</head>
<body class="shell fill bare">
<main class="shell-main" id="main" ko-history ko-location="/f/borrower-portal/d/loan-offers/window" ko-scope="/">
<div class="stack design-page window-page">
<section aria-label="Design" class="panel design" id="design" ko-attach="replace" ko-invoke="event:design-changed" ko-item ko-location="/f/borrower-portal/d/loan-offers/preview?view=window&amp;size=fit&amp;client=browser" ko-source="/f/borrower-portal/d/loan-offers/preview?view=window&amp;size=fit&amp;client=browser">
<div class="panel-head" id="design-bar" ko-invoke="event:files-changed" ko-source="/f/borrower-portal/d/loan-offers/preview/bar?view=window&amp;size=fit&amp;client=browser&amp;shown=0">
<div class="toolbar">
<span class="spacer">
</span>
</div>
</div>
<input form="capture-form" ko-as="frameWidth" name="frame.width" type="hidden" value="">
<input form="capture-form" ko-as="frameHeight" name="frame.height" type="hidden" value="">
<input form="capture-form" ko-as="frameAt" name="frame.at" type="hidden" value="">
<div class="design-frame" ko-as="frame">
<p class="empty">
No pages yet: give a route in routes.json a title, and it appears here.
</p>
</div>
</section>
</div>
</main>
<section aria-label="Notices" class="shell-notice">
<div aria-live="polite" id="notice" ko-focus="none" ko-region>
</div>
<button aria-label="Close" class="icon-btn small" command="--koda-empty" commandfor="notice" type="button">
<span aria-hidden="true" class="icon icon-close">
</span>
</button>
</section>
<aside aria-label="Drawer" class="shell-drawer">
<button aria-label="Close the drawer" class="icon-btn small" command="--koda-empty" commandfor="drawer" type="button">
<span aria-hidden="true" class="icon icon-close">
</span>
</button>
<div id="drawer" ko-focus="region" ko-region tabindex="-1">
</div>
</aside>
<dialog aria-label="Question" class="shell-modal" id="modal-dialog">
<button aria-label="Close" class="icon-btn small" command="--koda-empty" commandfor="modal" type="button">
<span aria-hidden="true" class="icon icon-close">
</span>
</button>
<div id="modal" ko-focus="region" ko-region tabindex="-1">
</div>
</dialog>
<section aria-label="Koda's warnings" class="shell-warnings">
<ol id="warnings" ko-warnings>
</ol>
<button aria-label="Clear the warnings" class="icon-btn small" command="--koda-empty" commandfor="warnings" type="button">
<span aria-hidden="true" class="icon icon-close">
</span>
</button>
</section>
<div hidden ko-connect="/_prelude/live">
</div>
<script type="module">
// The modal is a real dialog, open while its region holds something. // Koda fills and empties the region; showModal() is the platform's, and no // attribute calls it, so this follows the region. Escape closes the dialog, // and then empties the region too, so it forgets what it showed. A form in // it that goes to another page (Open a project) lands in the main region, // so the modal closes when the main region moves. The dialog is named by // the first heading of what's in it. const dialog = document.getElementById('modal-dialog'); const region = document.getElementById('modal'); const close = dialog.querySelector('[commandfor="modal"]'); const follow = () => { const filled = region.childElementCount > 0; const heading = region.querySelector('h1, h2, h3'); if (heading) dialog.setAttribute('aria-label', heading.textContent.trim()); if (filled && !dialog.open) dialog.showModal(); if (!filled && dialog.open) dialog.close(); }; new MutationObserver(follow).observe(region, { childList: true }); dialog.addEventListener('close', () => { if (region.childElementCount > 0) close.click(); }); const main = document.querySelector('body > main'); new MutationObserver(records => { if (dialog.open && records.some(record => record.oldValue !== main.getAttribute('ko-location'))) dialog.close(); }).observe(main, { attributes: true, attributeFilter: ['ko-location'], attributeOldValue: true }); follow(); // A menu is a popover (the design system's), which the browser closes on a // click outside it or Escape. A row pressed inside it doesn't leave the // page here: Koda swaps the page in or sends the form, and the bar or panel // stays put. So pressing a row closes its menu, as the person expects; a // form's own .btn (Use this size) isn't a row, and leaves it to its form. document.addEventListener('click', event => { const row = event.target.closest?.('.menu-list[popover] :is(a, button):not(.btn)'); const menu = row?.closest('.menu-list[popover]'); if (menu?.matches(':popover-open')) menu.hidePopover(); });
</script>
<script src="/static/desktop.js" type="module">
</script>
<script type="module">
import { start } from '@kodalang/core'; start(document);
</script>
</body>
</html>
