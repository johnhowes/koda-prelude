<form action="/f/borrower-portal/d/loan-offers/sessions" class="composer" ko-item method="post">
<ul aria-label="Images to send" class="attachments" id="attachments" ko-invoke="event:draft-changed" ko-source="/f/borrower-portal/d/loan-offers/draft">
</ul>
<div id="message-box" ko-region>
<label class="sr-only" for="message">
Message
</label>
<textarea aria-describedby="message-error" id="message" ko-as="message" ko-invalid-server="This is required." name="message" placeholder="Describe what to design, or paste a sketch or a screenshot. Enter to send, Shift+Enter for a new line." required rows="3">
</textarea>
</div>
<div hidden ko-debounce="800" ko-form="/f/borrower-portal/d/loan-offers/draft" ko-invoke="input:message" ko-method="post" ko-target="draftKept">
<input calc-value="message.value" ko-as="draftMessage" name="message" type="hidden">
</div>
<div class="composer-foot">
<div class="composer-tools">
<input name="lookingAt.include" type="hidden" value="false">
<label class="chip" title="Tells the agent which page you mean. Turn it off for a message about something else.">
<input checked name="lookingAt.include" type="checkbox" value="true">
<span aria-hidden="true" class="icon icon-screen">
</span>
<span class="chip-text" ko-invoke="event:design-changed" ko-source="/f/borrower-portal/d/loan-offers/looking-at">
<span class="sr-only">
Looking at
</span>
Offers · Typical
<span calc-text="lookingSize.value ? ' · ' + lookingSize.value : ''">
</span>
<input name="lookingAt.page" type="hidden" value="/offers">
<input name="lookingAt.state" type="hidden" value="01-typical">
<input calc-value="lookingSize.value" name="lookingAt.size" type="hidden">
</span>
</label>
<div ko-form="/f/borrower-portal/d/loan-offers/attachments" ko-invoke="change" ko-method="post" ko-target="attachments">
<label class="icon-btn small" title="Attach an image. You can also paste one, or drop it on the box.">
<span aria-hidden="true" class="icon icon-attach">
</span>
<span class="sr-only">
Attach an image
</span>
<input accept="image/png, image/jpeg, image/gif, image/webp" class="sr-only" ko-as="upload" multiple name="image" type="file">
</label>
</div>
<span id="dictation" ko-invoke="event:dictation-changed" ko-source="/f/borrower-portal/d/loan-offers/dictation/button">
<span class="cluster gap-2 dictation" ko-item>
<div ko-form="/f/borrower-portal/d/loan-offers/dictation/transcribe" ko-invoke="change" ko-method="post" ko-target="message-box">
<input ko-as="typed" name="message" type="hidden">
<input accept="audio/*" hidden ko-as="audio" name="audio" type="file">
<button aria-pressed="false" class="icon-btn small" ko-as="dictate" title="Dictate: press, then speak. Press again to stop, and what you said is typed in." type="button">
<span aria-hidden="true" class="icon icon-dictate">
</span>
<span class="sr-only">
Dictate
</span>
</button>
</div>
<div class="menu start up">
<button class="icon-btn small" ko-for="modelMenu" popovertarget title="The speech model dictation uses" type="button">
<span aria-hidden="true" class="icon icon-expand">
</span>
<span class="sr-only">
Speech model
</span>
</button>
<div class="menu-list" ko-as="modelMenu" popover>
<p class="menu-note muted">
Speech model: Balanced, 466 MB, kept on this computer.
</p>
<a href="/f/borrower-portal/d/loan-offers/dictation" ko-target="modal?">
<span class="item-title">
Change model…
</span>
<span class="muted">
Downloads the one you choose, then removes this one
</span>
</a>
<div ko-form="/f/borrower-portal/d/loan-offers/dictation/remove" ko-method="post" ko-target="dictation">
<input name="status" type="hidden" value="none">
<button type="submit">
<span class="item-title">
Remove the model
</span>
<span class="muted">
Frees 466 MB. Dictation is off until you set it up again.
</span>
</button>
</div>
</div>
</div>
<span class="muted" hidden ko-as="heard" role="status">
</span>
<script type="koda">
const { dictate, audio, typed, heard, onRemove } = koda.scope(); const say = text => { heard.element.textContent = text; heard.element.hidden = !text; }; let recorder = null; const stopMicrophone = () => recorder?.stream.getTracks().forEach(track => track.stop()); dictate.element.addEventListener('click', async () => { if (recorder) { recorder.stop(); return; } let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { say('Prelude can’t use the microphone. Allow it for Prelude in your system’s or browser’s settings, then try again.'); return; } if (!dictate.element.isConnected) { stream.getTracks().forEach(track => track.stop()); return; } const chunks = []; recorder = new MediaRecorder(stream); recorder.ondataavailable = event => chunks.push(event.data); recorder.onstop = () => { stopMicrophone(); recorder = null; dictate.element.setAttribute('aria-pressed', 'false'); const recording = new Blob(chunks, { type: chunks[0]?.type || 'audio/webm' }); if (recording.size === 0) { say('Nothing was heard. Press the microphone and speak.'); return; } say('Typing what you said…'); // What's typed so far goes too, so nothing typed while listening is lost. typed.element.value = document.getElementById('message')?.value ?? ''; const file = new DataTransfer(); file.items.add(new File([recording], 'dictation.webm', { type: recording.type })); audio.element.files = file.files; audio.element.dispatchEvent(new Event('change', { bubbles: true })); }; recorder.start(); dictate.element.setAttribute('aria-pressed', 'true'); say('Listening… press again when you’ve finished.'); }); onRemove(() => { if (recorder?.state === 'recording') { recorder.onstop = null; recorder.stop(); } stopMicrophone(); });
</script>
</span>
</span>
<span class="error" id="message-error">
This is required.
</span>
<span class="muted" ko-as="draftKept" ko-region role="status">
</span>
</div>
<button class="btn small primary" ko-as="send" type="submit">
Send
</button>
</div>
<template ko-as="sending">
<li class="entry user sending">
<div class="stack gap-1 sent">
<ul aria-label="Images" class="attachments">
</ul>
<div class="bubble">
</div>
<span class="muted looked-at">
Sending…
</span>
</div>
</li>
</template>
<script type="koda">
// What no binding or trigger expresses: Enter to send; taking an image // the person pastes or drops, which means moving a File into the // upload's input (it then uploads as if chosen there); and showing the // message the moment it's sent. Listened for on the form, since // dictation replaces the box itself. const { message, upload, send, sending } = koda.scope(); const form = message.element.form; const inBox = event => event.target.name === 'message'; // A message shown as sending that the server hasn't taken: this box came // back with a refusal, or the transcript already has the real one. for (const left of document.querySelectorAll('.entry.sending')) left.remove(); form.addEventListener('submit', event => { if (event.submitter && event.submitter !== send.element) return; // Remove on a thumbnail const words = message.element.value.trim(); const images = [...form.querySelectorAll('#attachments img.thumb')]; if (!words && !images.length) return; const list = document.getElementById(form.action.endsWith('/queue') ? 'queued' : 'transcript'); if (!list) return; const entry = sending.element.content.firstElementChild.cloneNode(true); const bubble = entry.querySelector('.bubble'); if (words) bubble.textContent = words; else bubble.remove(); const tray = entry.querySelector('.attachments'); for (const image of images) { const item = document.createElement('li'); item.append(image.cloneNode()); tray.append(item); } if (!images.length) tray.remove(); list.querySelector('.entry.starters')?.remove(); list.append(entry); }); form.addEventListener('keydown', event => { if (inBox(event) && event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); form.requestSubmit(); } }); const take = files => { const images = [...files].filter(file => file.type.startsWith('image/')); if (!images.length) return false; const moved = new DataTransfer(); for (const image of images) moved.items.add(image); upload.element.files = moved.files; upload.element.dispatchEvent(new Event('change', { bubbles: true })); return true; }; const carriesFiles = event => [...(event.dataTransfer?.types ?? [])].includes('Files'); form.addEventListener('paste', event => { if (inBox(event) && take(event.clipboardData?.files ?? [])) event.preventDefault(); }); form.addEventListener('dragover', event => { if (!carriesFiles(event)) return; event.preventDefault(); form.dataset.dropping = ''; }); form.addEventListener('dragleave', event => { if (!form.contains(event.relatedTarget)) delete form.dataset.dropping; }); form.addEventListener('drop', event => { delete form.dataset.dropping; if (carriesFiles(event) && take(event.dataTransfer.files)) event.preventDefault(); });
</script>
</form>
